<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Smart Canteen - Trang chính</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f5f7fa}
#appFrame{display:block;width:100%;height:100%;border:0;visibility:hidden}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#fff;font-family:Segoe UI,Arial,sans-serif;color:#1d3557;font-weight:700;z-index:10}
#loading .box{text-align:center;padding:24px}
#loading .icon{font-size:48px;margin-bottom:10px}
</style>
</head>
<body>
<div id="loading"><div class="box"><div class="icon">🍜</div><div>Đang mở Smart Canteen...</div></div></div>
<iframe id="appFrame" src="./app.html" title="Smart Canteen"></iframe>
<script>
(function(){
  'use strict';
  const frame=document.getElementById('appFrame');
  const loading=document.getElementById('loading');

  function getUser(){
    try{
      const raw=localStorage.getItem('smartCanteenDemoUser')||localStorage.getItem('currentUser');
      return raw?JSON.parse(raw):null;
    }catch(e){return null;}
  }

  function showApp(){
    loading.style.display='none';
    frame.style.visibility='visible';
  }

  function autoEnter(){
    const user=getUser();
    if(!user){showApp();return;}
    try{
      const win=frame.contentWindow;
      const doc=frame.contentDocument;
      if(!win||!doc){showApp();return;}

      // app.html có màn hình đăng nhập riêng. Đồng bộ phiên đăng nhập
      // từ trang index.html vào biến currentUser của app rồi gọi enterApp().
      // Cách này giữ nguyên toàn bộ giao diện/chức năng hiện có của app.
      const payload=JSON.stringify(user).replace(/\\/g,'\\\\').replace(/'/g,"\\'");
      win.eval("currentUser = JSON.parse('"+payload.replace(/'/g,"\\'")+"'); enterApp();");
      setTimeout(showApp,80);
    }catch(error){
      console.error('Không thể tự động mở trang chính:',error);
      showApp();
    }
  }

  frame.addEventListener('load',autoEnter,{once:true});
  setTimeout(showApp,5000);
})();
</script>
</body>
</html>
