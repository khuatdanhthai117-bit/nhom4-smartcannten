<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Smart Canteen - Đăng nhập</title><style>body{margin:0;font-family:Arial;background:linear-gradient(135deg,#1d3557,#457b9d,#e63946);min-height:100vh;display:grid;place-items:center}.card{background:#fff;padding:30px;border-radius:20px;width:min(460px,90%)}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px}.tabs button,.submit{padding:10px;border:0;border-radius:8px}.tabs button.active,.submit{background:#e63946;color:#fff}.group{margin:12px 0}.group input{width:100%;padding:10px;box-sizing:border-box}.msg{min-height:20px}</style></head><body><div class="card" id="loginCard"><h1>🍜 Smart Canteen</h1><p>Đăng nhập hệ thống</p><div class="tabs"><button class="active" data-type="student">Sinh viên</button><button data-type="lecturer">Giảng viên</button><button data-type="guest">Khách</button><button data-type="staffadmin">Nhân viên / Admin</button></div><form id="loginForm"><div class="group"><label id="identifierLabel">MSSV / Email</label><input id="identifier" required></div><div class="group" id="passwordGroup"><label>Mật khẩu</label><input id="password" type="password" required></div><div class="group" id="otpGroup" hidden><label>OTP</label><input id="otp" maxlength="6"></div><button class="submit" style="width:100%">Đăng nhập</button><div id="message" class="msg"></div></form><p><b>Demo:</b><br>22123456 / sv123<br>gv@truong.edu.vn / gv123<br>staff@canteen.vn / staff123<br>admin@canteen.vn / admin123<br>Khách: SĐT + 123456</p></div><iframe id="app" title="Smart Canteen" style="display:none;position:fixed;inset:0;width:100%;height:100%;border:0"></iframe><script>const D=[{id:1,name:'Nguyễn Văn An',identifier:'22123456',email:'an@truong.edu.vn',phone:'0912345678',password:'sv123',role:'student'},{id:2,name:'Trần Thị Bình',identifier:'gv@truong.edu.vn',email:'gv@truong.edu.vn',phone:'0987654321',password:'gv123',role:'lecturer'},{id:3,name:'Nhân viên Căng tin',identifier:'staff@canteen.vn',email:'staff@canteen.vn',phone:'0900000001',password:'staff123',role:'staff'},{id:4,name:'Quản trị viên',identifier:'admin@canteen.vn',email:'admin@canteen.vn',phone:'0900000002',password:'admin123',role:'admin'}];let type='student';const $=id=>document.getElementById(id);function setType(t){type=t;document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active',b.dataset.type===t));const g=t==='guest';$('identifierLabel').textContent=g?'Số điện thoại':t==='student'?'MSSV / Email':t==='lecturer'?'Email':'Email nhân viên / admin';$('passwordGroup').hidden=g;$('otpGroup').hidden=!g;$('password').required=!g;$('otp').required=g}function seed(){let s={};try{s=JSON.parse(localStorage.getItem('smartCanteenState')||'{}')||{}}catch{}const u=Array.isArray(s.users)?s.users:[];for(const d of D){const f=u.find(x=>x.identifier===d.identifier||x.email===d.email);if(f)Object.assign(f,d);else u.push({...d})}s.users=u;localStorage.setItem('smartCanteenState',JSON.stringify(s))}function msg(t,e=true){$('message').textContent=t;$('message').style.color=e?'#dc3545':'#2a9d8f'}$('loginForm').addEventListener('submit',e=>{e.preventDefault();seed();const id=$('identifier').value.trim();if(type==='guest'){const p=id.replace(/\D/g,'');if(!/^\d{10,11}$/.test(p))return msg('Số điện thoại không hợp lệ.');if($('otp').value.trim()!=='123456')return msg('OTP demo không đúng. Hãy nhập 123456.');localStorage.setItem('smartCanteenDemoUser',JSON.stringify({id:'guest-'+Date.now(),name:'Khách '+p.slice(-4),identifier:p,phone:p,role:'guest'}))}else{const pw=$('password').value;const u=D.find(x=>(x.identifier===id||x.email===id)&&x.password===pw);if(!u)return msg('Tài khoản hoặc mật khẩu không đúng.');localStorage.setItem('smartCanteenDemoUser',JSON.stringify({...u}))}msg('Đăng nhập thành công.',false);$('loginCard').style.display='none';$('app').src='./app.html?demo=20260917';$('app').style.display='block'});document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>setType(b.dataset.type));setType('student');seed();</script></body></html>
