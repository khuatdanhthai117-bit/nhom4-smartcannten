<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Smart Canteen</title>
  <style>
    html,body{margin:0;width:100%;height:100%;background:#f5f7fa;font-family:Segoe UI,Arial,sans-serif;overflow:hidden}
    #app{width:100%;height:100%;border:0;display:block}
    #loading{position:fixed;inset:0;display:grid;place-items:center;background:linear-gradient(135deg,#1d3557,#457b9d,#e63946);color:#fff;z-index:2}
    .box{background:rgba(255,255,255,.96);color:#1d3557;border-radius:18px;padding:26px 30px;box-shadow:0 20px 60px rgba(0,0,0,.2);text-align:center;max-width:420px;margin:20px}
    .box h1{margin:0 0 8px}.box p{margin:6px 0;color:#6c757d}.demo{margin-top:15px;padding:12px;background:#f8f9fa;border-radius:10px;font-size:13px;line-height:1.65;text-align:left}
  </style>
</head>
<body>
  <div id="loading">
    <div class="box">
      <h1>🍜 Smart Canteen</h1>
      <p>Đang khởi tạo dữ liệu demo...</p>
      <div class="demo">
        <b>Sinh viên:</b> 22123456 / sv123<br>
        <b>Giảng viên:</b> gv@truong.edu.vn / gv123<br>
        <b>Nhân viên:</b> staff@canteen.vn / staff123<br>
        <b>Admin:</b> admin@canteen.vn / admin123
      </div>
    </div>
  </div>
  <script>
    (function () {
      const demoUsers = [
        { id: 1, name: "Nguyễn Văn An", identifier: "22123456", email: "an@truong.edu.vn", phone: "0912345678", password: "sv123", role: "student" },
        { id: 2, name: "Trần Thị Bình", identifier: "gv@truong.edu.vn", email: "gv@truong.edu.vn", phone: "0987654321", password: "gv123", role: "lecturer" },
        { id: 3, name: "Nhân viên Căng tin", identifier: "staff@canteen.vn", email: "staff@canteen.vn", phone: "0900000001", password: "staff123", role: "staff" },
        { id: 4, name: "Quản trị viên", identifier: "admin@canteen.vn", email: "admin@canteen.vn", phone: "0900000002", password: "admin123", role: "admin" }
      ];

      try {
        let state = {};
        const raw = localStorage.getItem("smartCanteenState");
        if (raw) {
          try { state = JSON.parse(raw) || {}; } catch { state = {}; }
        }
        const users = Array.isArray(state.users) ? state.users : [];

        for (const demo of demoUsers) {
          const existing = users.find((u) => u.identifier === demo.identifier || u.email === demo.email);
          if (existing) Object.assign(existing, demo);
          else users.push({ ...demo });
        }

        state.users = users;
        localStorage.setItem("smartCanteenState", JSON.stringify(state));
      } catch (error) {
        try { localStorage.removeItem("smartCanteenState"); } catch {}
      }

      const iframe = document.createElement("iframe");
      iframe.id = "app";
      iframe.title = "Smart Canteen";
      iframe.src = "./index.html?demo=20260917";
      iframe.addEventListener("load", function () {
        setTimeout(() => document.getElementById("loading")?.remove(), 150);
      });
      document.body.appendChild(iframe);
    })();
  </script>
</body>
</html>
