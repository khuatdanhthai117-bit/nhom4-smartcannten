<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Smart Canteen</title>
</head>
<body>
  <p>Đang mở Smart Canteen...</p>
  <script>
    (function () {
      const demoUsers = [
        { id: 1, name: "Nguyễn Văn An", identifier: "22123456", email: "an@truong.edu.vn", phone: "0912345678", password: "sv123", role: "student" },
        { id: 2, name: "Trần Thị Bình", identifier: "gv@truong.edu.vn", email: "gv@truong.edu.vn", phone: "0987654321", password: "gv123", role: "lecturer" },
        { id: 3, name: "Nhân viên Căng tin", identifier: "staff@canteen.vn", email: "staff@canteen.vn", phone: "0900000001", password: "staff123", role: "staff" },
        { id: 4, name: "Quản trị viên", identifier: "admin@canteen.vn", email: "admin@canteen.vn", phone: "0900000002", password: "admin123", role: "admin" }
      ];

      try {
        const state = JSON.parse(localStorage.getItem("smartCanteenState") || "null") || {};
        const users = Array.isArray(state.users) ? state.users : [];
        let changed = false;

        for (const demo of demoUsers) {
          const existing = users.find((item) => item.identifier === demo.identifier || item.email === demo.email);
          if (!existing) {
            users.push({ ...demo });
            changed = true;
          } else if (existing.password !== demo.password || existing.role !== demo.role || existing.identifier !== demo.identifier) {
            Object.assign(existing, demo);
            changed = true;
          }
        }

        if (changed || !localStorage.getItem("smartCanteenState")) {
          state.users = users;
          localStorage.setItem("smartCanteenState", JSON.stringify(state));
        }
      } catch (error) {
        // Nếu dữ liệu cũ bị lỗi, xóa state hỏng để Smart Canteen tự tạo dữ liệu demo mặc định.
        localStorage.removeItem("smartCanteenState");
      }

      window.location.replace("./public/index.html");
    })();
  </script>
  <noscript><a href="./public/index.html">Mở Smart Canteen</a></noscript>
</body>
</html>
