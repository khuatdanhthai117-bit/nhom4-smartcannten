name: Migrate Smart Canteen UI to JavaScript

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Convert HTML UI to external JavaScript
        shell: python
        run: |
          from pathlib import Path
          import json
          import re

          root = Path('.')
          js_dir = root / 'public' / 'js'
          js_dir.mkdir(parents=True, exist_ok=True)

          def migrate_html(src_name, js_name, title, include_enhancements=False):
              src = root / src_name
              text = src.read_text(encoding='utf-8')

              style_match = re.search(r'<style[^>]*>(.*?)</style>', text, re.S | re.I)
              body_match = re.search(r'<body[^>]*>(.*?)</body>', text, re.S | re.I)
              if not style_match or not body_match:
                  raise SystemExit(f'Cannot parse {src_name}; refusing unsafe migration')

              style = style_match.group(1).strip()
              body = body_match.group(1)
              scripts = re.findall(r'<script(?:[^>]*)>(.*?)</script>', body, re.S | re.I)
              body_html = re.sub(r'<script(?:[^>]*)>.*?</script>', '', body, flags=re.S | re.I).strip()

              if not scripts:
                  raise SystemExit(f'No inline JavaScript found in {src_name}; refusing unsafe migration')

              # app.html has a boot guard followed by the main application script.
              boot = scripts[0] if 'localStorage.getItem("smartCanteenDemoUser")' in scripts[0] else ''
              main = scripts[-1]

              loader = []
              loader.append('(function(){')
              loader.append('  "use strict";')
              loader.append(f'  const root = document.getElementById("smartCanteenRoot");')
              loader.append('  if(!root) throw new Error("smartCanteenRoot is missing");')
              loader.append(f'  const style=document.createElement("style"); style.id={json.dumps("smart-canteen-generated-style")}; style.textContent={json.dumps(style, ensure_ascii=False)}; document.head.appendChild(style);')
              loader.append(f'  root.innerHTML={json.dumps(body_html, ensure_ascii=False)};')

              if boot:
                  loader.append(f'  const boot=document.createElement("script"); boot.textContent={json.dumps(boot, ensure_ascii=False)}; document.body.appendChild(boot);')

              loader.append(f'  const main=document.createElement("script"); main.textContent={json.dumps(main, ensure_ascii=False)}; document.body.appendChild(main);')

              if include_enhancements:
                  loader.append('  const enhancement=document.createElement("script"); enhancement.src="./js/enhancements.js"; document.body.appendChild(enhancement);')

              loader.append('})();')
              (js_dir / js_name).write_text('\n'.join(loader) + '\n', encoding='utf-8')

              minimal = f'''<!doctype html>\n<html lang="vi">\n<head>\n<meta charset="utf-8">\n<meta name="viewport" content="width=device-width,initial-scale=1">\n<title>{title}</title>\n</head>\n<body>\n<div id="smartCanteenRoot"></div>\n<script src="./js/{js_name}" defer></script>\n</body>\n</html>\n'''
              src.write_text(minimal, encoding='utf-8')

          migrate_html('public/index.html', 'login.js', 'Smart Canteen - Đăng nhập')
          migrate_html('public/app.html', 'app.js', 'Smart Canteen - Hệ thống đặt món thông minh', include_enhancements=True)

          (root / 'index.html').write_text('''<!doctype html>\n<html lang="vi">\n<head>\n<meta charset="utf-8">\n<meta name="viewport" content="width=device-width,initial-scale=1">\n<title>Smart Canteen</title>\n</head>\n<body>\n<script src="./public/js/root.js" defer></script>\n</body>\n</html>\n''', encoding='utf-8')
          (js_dir / 'root.js').write_text('''(() => {\n  "use strict";\n  window.location.replace("./public/index.html");\n})();\n''', encoding='utf-8')

          # Remove old experimental login wrappers/workflows. Keep the normal CI workflow.
          for rel in [
              'public/main.html',
              'public/launcher.html',
              '.github/workflows/fix-login.yml',
              '.github/workflows/fix-login-final.yml',
              '.github/workflows/finalize-login.yml',
          ]:
              p = root / rel
              if p.exists():
                  p.unlink()

          # Basic sanity checks on the generated files.
          for p in [root/'public/index.html', root/'public/app.html', root/'index.html']:
              t = p.read_text(encoding='utf-8')
              if '<script src=' not in t:
                  raise SystemExit(f'{p} does not load an external JavaScript file')

          for p in [js_dir/'login.js', js_dir/'app.js', js_dir/'root.js']:
              if not p.exists() or p.stat().st_size < 50:
                  raise SystemExit(f'{p} was not generated correctly')

      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No migration changes needed."
            exit 0
          fi
          git commit -m "Move Smart Canteen UI and logic to JavaScript"
          git push
