name: Final Smart Canteen login flow repair

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Make app page login-free
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('public/app.html')
          s = p.read_text(encoding='utf-8')

          # The app page must never display its own login card.
          s, n = re.subn(r'(\\.auth-screen\\{[^}]*)(\\})', r'\\1;display:none!important\\2', s, count=1)
          if n != 1:
              raise SystemExit('auth-screen style not found; refusing unsafe edit')

          old_boot = '''<script>\n(function(){\n  try {\n    const raw=localStorage.getItem("smartCanteenDemoUser")||localStorage.getItem("currentUser");\n    if(raw){ document.documentElement.classList.add("has-session"); }\n    else if(new URLSearchParams(location.search).get("login")==="1"){ window.location.replace("./index.html"); }\n  } catch(e) {}\n})();\n</script>'''
          new_boot = '''<script>\n(function(){\n  try {\n    const raw=localStorage.getItem("smartCanteenDemoUser")||localStorage.getItem("currentUser");\n    if(raw){\n      const u=JSON.parse(raw);\n      if(u&&u.role){ document.documentElement.classList.add("has-session"); return; }\n    }\n    window.location.replace("./index.html");\n  } catch(e) {\n    window.location.replace("./index.html");\n  }\n})();\n</script>'''
          if old_boot not in s:
              raise SystemExit('expected boot guard not found; refusing unsafe edit')
          s = s.replace(old_boot, new_boot, 1)

          old_init = '''  document.getElementById("authScreen").classList.remove("hidden");\n  document.getElementById("mainApp").classList.add("hidden");\n  setLoginType("student",document.querySelector(".auth-tab"));'''
          new_init = '''  window.location.replace("./index.html");'''
          if old_init not in s:
              raise SystemExit('expected no-session init block not found; refusing unsafe edit')
          s = s.replace(old_init, new_init, 1)

          old_logout = 'function logout(){currentUser=null;cart=[];discountCode="";localStorage.removeItem("smartCanteenDemoUser");localStorage.removeItem("currentUser");localStorage.removeItem("smartCanteenLoggedIn");document.documentElement.classList.remove("has-session");document.getElementById("mainApp").classList.add("hidden");document.getElementById("authScreen").classList.remove("hidden");showLogin();setLoginType("student",document.querySelector(".auth-tab"))}'
          new_logout = 'function logout(){currentUser=null;cart=[];discountCode="";localStorage.removeItem("smartCanteenDemoUser");localStorage.removeItem("currentUser");localStorage.removeItem("smartCanteenLoggedIn");window.location.replace("./index.html")}'
          if old_logout not in s:
              raise SystemExit('expected logout block not found; refusing unsafe edit')
          s = s.replace(old_logout, new_logout, 1)

          p.write_text(s, encoding='utf-8')

      - name: Remove obsolete workflow and launcher files
        run: |
          rm -f public/launcher.html public/main.html .github/workflows/fix-login.yml .github/workflows/finalize-login.yml

      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No repair changes needed."
            exit 0
          fi
          git commit -m "Finalize single-page login flow"
          git push
