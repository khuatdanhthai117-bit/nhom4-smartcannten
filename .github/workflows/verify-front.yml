name: Verify frontend JavaScript

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check frontend JavaScript syntax
        run: node --check public/js/login.js && node --check public/js/app.js
      - name: Check HTML loaders
        run: |
          grep -q './js/login.js' public/index.html
          grep -q './js/app.js' public/app.html
      - name: Verify backend tests
        run: npm install && npm test
